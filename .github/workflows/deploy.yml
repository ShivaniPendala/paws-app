name: Deploy to Firebase and Cloud Run

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    - name: Deploy Frontend to Firebase Hosting
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: firebase deploy --only hosting --project project-p-507510

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Artifact Registry
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      run: |
        echo $GOOGLE_APPLICATION_CREDENTIALS | docker login -u _json_key --password-stdin https://us-central1-docker.pkg.dev

    - name: Build and push Docker image
      working-directory: ./backend
      run: |
        IMAGE=us-central1-docker.pkg.dev/project-p-507510/paws-app/backend
        docker build -t $IMAGE .
        docker push $IMAGE

    - name: Deploy to Cloud Run
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
      run: |
        gcloud run deploy paws-backend --image $IMAGE --region us-central1 --platform managed --allow-unauthenticated --project project-p-507510
