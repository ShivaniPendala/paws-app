name: Deploy to Firebase and Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Fix Deprecation Warning: Upgrade actions to v4
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fix "Not in a Firebase app directory" Error: Run npm and build inside ./frontend
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Frontend to Firebase Hosting
        working-directory: ./frontend
        run: firebase deploy --only hosting --project project-p-507510
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}